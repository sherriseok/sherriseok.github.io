<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>你的名字</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #faf6f3;
    color: #2b2b2b;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card { text-align: center; padding: 40px 24px; max-width: 560px; }
  h1 { font-size: 2.4rem; letter-spacing: 3px; margin-bottom: 12px; }
  .sub { color: #8a7f78; margin-bottom: 28px; letter-spacing: 1px; }
  p.bio { line-height: 2; margin-bottom: 36px; font-size: 1.02rem; }
  .links a {
    display: inline-block;
    margin: 0 8px 12px;
    padding: 10px 24px;
    border: 1px solid #e8c4b8;
    border-radius: 999px;
    color: #c96f4a;
    text-decoration: none;
    font-size: .95rem;
  }
  .links a:hover { background: #c96f4a; color: #fff; transition: .2s; }
  footer { margin-top: 48px; font-size: .8rem; color: #c0b4ad; }
</style>
</head>
<body>
  <div class="card">
    <h1>你的名字</h1>
    <div class="sub">视觉传达设计 · 杭州</div>
    <p class="bio">你好，我是一名视觉传达专业学生。<br>喜欢海报、插画和一切好看的东西。<br>这里是我的线上小角落。</p>
    <div class="links">
      <a href="#">作品集</a>
      <a href="#">小红书</a>
      <a href="#">微店</a>
    </div>
    <footer>© 2026 你的名字 · Powered by GitHub Pages</footer>
  </div>
</body>
</html>
